
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victory Sylvanus Ekpo | Virtual Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FFFFFF;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, .font-heading {
        font-family: 'Outfit', sans-serif;
      }
      
      /* Updated Brand Color Utilities */
      .primary-color { color: #6B3F69; }
      .secondary-color { color: #8D5F8C; }
      .accent-bg { background-color: #A376A2; }
      .accent-color { color: #A376A2; }
      .secondary-bg { background-color: #8D5F8C; }
      .primary-bg { background-color: #6B3F69; }
      .neutral-highlight { background-color: #DDC3C3; }
      .hero-bg { background-color: #1a0f1a; } /* Darker shade of brand purple for hero background */

      /* Animations */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-up {
        opacity: 0;
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @keyframes softSlide {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-soft-slide {
        animation: softSlide 1s ease-out forwards;
      }

      @keyframes typewriter {
        from { width: 0; }
        to { width: 100%; }
      }
      .typewriter-container {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        border-right: 3px solid #A376A2;
        animation: typewriter 3s steps(40, end) forwards, blink 0.75s step-end infinite;
      }
      @keyframes blink {
        from, to { border-color: transparent }
        50% { border-color: #A376A2; }
      }
      
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in {
        opacity: 0;
        animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .btn-primary {
        background-color: #A376A2;
        color: #FFFFFF;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-primary:hover {
        background-color: #6B3F69;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(107, 63, 105, 0.2);
      }

      /* Hover Effects */
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      }

      /* Scroll reveal utility */
      .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
